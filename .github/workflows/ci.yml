name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux proves the cross-platform claim; Windows exercises the native
        # integrated-auth / signing paths that only compile-guard off Windows.
        os: [ ubuntu-latest, windows-latest ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Report toolchain
        shell: pwsh
        run: |
          "dotnet : $(dotnet --version)"
          "pwsh   : $($PSVersionTable.PSVersion)"

      - name: Build module (compiles the solution, stages module/*.dll)
        shell: pwsh
        run: ./build.ps1 -Configuration Release

      - name: Unit tests (xUnit)
        run: dotnet test tests/ADx.Tests/ADx.Tests.csproj --configuration Release --verbosity minimal

      - name: Packaging & module tests (Pester, offline)
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable Pester | Where-Object { $_.Version -ge [version]'5.0' })) {
            Set-PSRepository PSGallery -InstallationPolicy Trusted
            Install-Module Pester -MinimumVersion 5.0 -Force -SkipPublisherCheck -Scope CurrentUser
          }
          # The live-lab suite self-skips when -PRIVATE/adx-lab is absent (it always is in CI),
          # so this runs the offline packaging/parameter/format gate only.
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = 'tests/ADx.Tests.ps1'
          $cfg.Run.Exit = $true
          $cfg.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $cfg
